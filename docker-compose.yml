version: "3.8"

services:

  spring-api:
    build:
      context: ./springboot-api
    container_name: spring-api
    ports:
      - "8080:8080"
    networks:
      - apim-net

  apim:
    image: wso2/wso2am:4.7.0
    container_name: wso2-apim
    ports:
      - "9443:9443"
      - "8243:8243"
      - "8280:8280"
    environment:
      - WSO2_SERVER_ROLE=default
    volumes:
      - ./apim/deployment.toml:/home/wso2carbon/wso2am-4.7.0/repository/conf/deployment.toml:ro

    depends_on:
      - spring-api
    networks:
      - apim-net

networks:
  apim-net:
    driver: bridge